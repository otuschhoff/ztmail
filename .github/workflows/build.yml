name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish (leave empty for a build only)
        required: false
        type: string

permissions:
  contents: read

env:
  GOPRIVATE: github.com/otuschhoff/*
  GIT_TERMINAL_PROMPT: '0'

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Set shared build metadata
        id: metadata
        run: |
          echo "build_time=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Download private dependencies
        env:
          ADBIND_READ_TOKEN: ${{ secrets.ADBIND_READ_TOKEN }}
        run: |
          if [ -z "$ADBIND_READ_TOKEN" ]; then
            echo "::error::Configure ADBIND_READ_TOKEN with read access to the private AD SDK repository."
            exit 1
          fi
          git config --global credential.https://github.com.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$ADBIND_READ_TOKEN"; }; f'
          go mod download
          git config --global --unset credential.https://github.com.helper
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: make test
      - name: Build CGO-free binary
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
        run: |
          make build-one
          go version -m dist/* | tee build-info.txt
          grep -q 'CGO_ENABLED=0' build-info.txt
      - name: Verify version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
        run: |
          test "$(dist/ztmail-linux-amd64 --version)" = "0.1.0+${BUILD_TIME}.${COMMIT_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: ztmail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ztmail-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets and generate checksums
        working-directory: release-assets
        run: |
          for binary in \
            ztmail-linux-amd64 ztmail-linux-arm64 \
            ztmail-windows-amd64.exe ztmail-windows-arm64.exe \
            ztmail-darwin-amd64 ztmail-darwin-arm64; do
            test -s "$binary"
          done
          sha256sum ztmail-* > SHA256SUMS
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A version tag such as v0.1.0 is required."
            exit 1
          fi
          prerelease=false
          version_tag="${RELEASE_TAG%%+*}"
          if [[ "$version_tag" == *-* ]]; then
            prerelease=true
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > release-tags.txt
          if ! grep -Fxq -- "$RELEASE_TAG" release-tags.txt; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --draft --prerelease="$prerelease"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease"
